name: Bug report
description: Report a reproducible Filter FabJS problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping test Filter FabJS. Please include enough detail to reproduce the problem.
  - type: input
    id: version
    attributes:
      label: Filter FabJS version
      placeholder: 2.1.0
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 151
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and GPU
      placeholder: Windows 11 / NVIDIA RTX 3060
  - type: dropdown
    id: renderer
    attributes:
      label: Renderer
      options:
        - Auto
        - GPU
        - CPU
        - Not sure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the filter/formulas and source-image details when relevant.
      placeholder: "1. Open...\n2. Select...\n3. Render..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and error/status text
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, filter JSON/AFS examples, CPU/GPU comparison, or other useful details.
