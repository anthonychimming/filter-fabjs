<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Filter FabJS Library Manager</title><link rel="stylesheet" href="/library-manager.css"><script type="module" src="/library-manager.js"></script></head>
<body>
  <header><div><strong>Filter FabJS</strong><span class="subtitle">Library Manager</span></div><span id="health">Reading library…</span><button id="refresh" type="button">Refresh Library</button></header>
  <nav aria-label="Manager sections"><button id="library-tab" aria-current="page">Library</button><button id="history-tab">History</button><button id="publish-tab">Publish <span id="pending-count">0</span></button></nav>
  <div id="notice" role="status" aria-live="polite"></div>
  <main>
    <section id="library-panel" aria-label="Library">
      <div class="toolbar"><label class="search">Search filters<input id="search" type="search" placeholder="Name, ID, author, description or tags"></label><label>Status<select id="status"><option>All</option><option>Published</option><option>Draft</option><option>Changed</option><option>Unpublished</option><option>Invalid</option><option>Incomplete</option><option>Ready to Publish</option></select></label><label>Sort<select id="sort"><option value="name">Name</option><option value="id">ID</option><option value="status">Status</option><option value="revision">Revision</option><option value="modifiedAt">Recently modified</option><option value="publishedAt">Recently published</option></select></label><button id="add" class="primary">+ Add Filter</button></div>
      <div class="workspace"><aside aria-label="Filters"><p id="result-count"></p><div id="filters"></div></aside><section id="details" aria-label="Filter details"></section></div>
    </section>
    <section id="history-panel" hidden aria-label="Filter history"></section>
    <section id="publish-panel" hidden aria-label="Publication review"></section>
  </main>
  <footer><span id="pending-summary">No pending publication changes</span><button id="review-button">Review Changes →</button></footer>
</body></html>
